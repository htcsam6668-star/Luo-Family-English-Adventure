const STORE="luoEnglishCurriculumV14";
const LEGACY="englishAdventureV1";const PREVIOUS="luoEnglishCurriculumV13";
const $=id=>document.getElementById(id);
const uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():"op-"+Date.now()+"-"+Math.random().toString(36).slice(2);
function read(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function makeState(){let old=read(LEGACY);return {version:13,children:[{id:"luo-sister",name:"姊姊｜小四",grade:4,semester:1},{id:"luo-brother",name:"弟弟｜幼兒園小班",grade:0,semester:1}],active:"luo-sister",records:[],curriculum:seeded,legacyBackup:old,legacyImported:false}}
let state=read(STORE);if(!state||!Array.isArray(state.children)||!Array.isArray(state.curriculum)) {let prev=read(PREVIOUS);state=(prev&&Array.isArray(prev.children)&&Array.isArray(prev.curriculum))?JSON.parse(JSON.stringify(prev)):makeState();}
// Append-only seed. Never replace user-modified curriculum units or learning records.
for(const unit of SUPPLEMENT_UNITS){if(!state.curriculum.some(c=>c.grade===unit.grade&&c.semester===0&&c.unit===unit.unit&&c.track==="supplement"))state.curriculum.push(unit)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert("本機儲存失敗，請先匯出備份")}}
const kid=()=>state.children.find(c=>c.id===state.active)||state.children[0];
const selected=()=>state.curriculum.find(c=>c.grade===Number($("grade").value)&&c.semester===(($("track").value==="supplement")?0:Number($("semester").value))&&c.unit===$("unit").value&&(c.track||"textbook")===$("track").value);
let idx=0,quiz=null,tab="learn";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function speak(en){if(!("speechSynthesis" in window)){alert("裝置不支援語音");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(en);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
function initSelectors(){let k=kid();$("child").innerHTML=state.children.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");$("child").value=k.id;$("grade").innerHTML=[0,1,2,3,4,5,6].map(g=>`<option value="${g}">${g===0?"幼兒":`國小${g}年級`}</option>`).join("");$("grade").value=k.grade;$("semester").value=k.semester;renderUnits()}
function renderUnits(){let g=Number($("grade").value),s=$("track").value==="supplement"?0:Number($("semester").value),units=state.curriculum.filter(c=>c.grade===g&&c.semester===s&&(c.track||"textbook")===$("track").value);$("semester").disabled=$("track").value==="supplement";$("unit").innerHTML=units.length?units.map(c=>`<option value="${esc(c.unit)}">${esc(c.unit)}｜${esc(c.title)}</option>`).join(""):`<option value="">尚未匯入單元</option>`;idx=0;renderLearn()}
function words(){return selected()?.words||[]}
function renderLearn(){let c=selected(),w=words()[idx%Math.max(1,words().length)];$("source").textContent=c?`${c.grade===0?"幼兒":`國小${c.grade}年級`}｜${c.track==="supplement"?"生活主題補充教材":(GRADE_MAP[c.grade]?.[c.semester-1]||"原創教材")}｜${c.unit}｜${c.sourceType==="user_provided"?"使用者提供／非官方逐課內容":(c.sourceType==="original"?"原創示範":"家長提供／待核對")}｜${c.verified?"已核對":"未核對"}`:"目前無教材；請至家長工具匯入。";$("learnCard").innerHTML=w?`<p class="muted">第 ${idx+1} / ${words().length} 個</p><div class="big">${esc(w.emoji||"📖")}</div><p class="muted">${w.kind==="phrase"?"片語練習":"單字練習"}</p><h1>${esc(w.en)}</h1><h2>${esc(w.zh)}</h2>`:"<p>目前單元尚無單字。</p>"}
function switchTab(t){tab=t;document.querySelectorAll("main>section[id]").forEach(x=>x.classList.toggle("hidden",x.id!==t));document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));if(t==="review")renderReview();if(t==="records")renderRecords();if(t==="curriculum")renderCurriculum();if(t==="parent")renderParent()}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(review=false){let pool=words();if(review){let wrong=new Set(state.records.filter(r=>r.childId===kid().id&&r.unitId===unitId()).filter(r=>!r.firstCorrect).map(r=>r.wordId));pool=pool.filter(w=>wrong.has(w.id||w.en))}if(!pool.length){$("question").textContent="沒有可測驗的單字。";switchTab("quiz");return}let type=$("quizType").value;if(kid().grade===0&&type==="spell"){type="choice";$("quizType").value="choice"}quiz={items:shuffle(pool).slice(0,10),pos:0,score:0,type,locked:false,attempts:0};switchTab("quiz");renderQuestion()}
function unitId(){let c=selected();return c?`${c.track||"textbook"}:${c.grade}-${c.semester}-${c.unit}`:""}
function renderQuestion(){if(!quiz)return;if(quiz.pos>=quiz.items.length){$("question").innerHTML=`<h2>🎉 完成！首次答對 ${quiz.score} / ${quiz.items.length}</h2><button id="again">再玩一次</button>`;$("again").onclick=()=>startQuiz();return}let w=quiz.items[quiz.pos],type=quiz.type;let out=`<p>第 ${quiz.pos+1}/${quiz.items.length} 題</p>`;if(type==="spell")out+=`<h2>${esc(w.zh)} 的英文？</h2><input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="spellSubmit">確定</button>`;else{let options=shuffle([w,...shuffle(words().filter(x=>x!==w)).slice(0,3)]);out+=`<h2>${type==="listen"?"🔊 聽英文選中文":esc(w.zh)+" 的英文？"}</h2>${type==="listen"?'<button id="play">🔊 播放題目</button>':""}<div class="options">${options.map(o=>`<button class="answer" data-id="${esc(o.id||o.en)}">${esc(type==="listen"?o.zh:o.en)}</button>`).join("")}</div>`}out+='<div id="feedback" aria-live="polite"></div>';$("question").innerHTML=out;document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(b.dataset.id===(w.id||w.en)));if(type==="listen")$("play").onclick=()=>speak(w.en);if(type==="spell"){$("spellSubmit").onclick=()=>answer($("spellInput").value.trim().toLowerCase()===w.en.toLowerCase());$("spellInput").onkeydown=e=>{if(e.key==="Enter")$("spellSubmit").click()}}}

function renderRewardGate(){let configured=!!read(PIN_KEY);parentRewardPanel.innerHTML='<h2>👪 家長專區</h2><p>'+(configured?'輸入家長密碼，管理獎勵與核對兌換。':'先設定家長密碼，之後由家長管理獎勵與核對兌換。')+'</p><form id="rewardPinForm"><label>家長密碼（4～8位數字）<input id="rewardPin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4,8}" required></label>'+(!configured?'<label>再次輸入<input id="rewardPinAgain" type="password" inputmode="numeric" autocomplete="off" required></label>':'')+'<button>進入家長專區</button></form><p id="pinMessage" aria-live="polite"></p>';$('rewardPinForm').onsubmit=async e=>{e.preventDefault();let p=$('rewardPin').value,button=e.target.querySelector('button');button.disabled=true;try{if(!/^\d{4,8}$/.test(p))throw Error('請輸入4～8位數字');let stored=read(PIN_KEY);if(stored?.blockedUntil>Date.now())throw Error('請稍後再試');if(!stored){if(p!==$('rewardPinAgain').value)throw Error('兩次密碼不同');let salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(PIN_KEY,JSON.stringify({salt,hash:await pinHash(p,salt),failures:0}))}else{if(await pinHash(p,stored.salt)!==stored.hash){stored.failures=(stored.failures||0)+1;if(stored.failures>=5){stored.blockedUntil=Date.now()+60000;stored.failures=0}localStorage.setItem(PIN_KEY,JSON.stringify(stored));throw Error('家長密碼不正確')}stored.failures=0;stored.blockedUntil=0;localStorage.setItem(PIN_KEY,JSON.stringify(stored))}parentUntil=Date.now()+30*60*1000;renderParent()}catch(err){if($('pinMessage'))$('pinMessage').textContent=err.message}finally{button.disabled=false}}}
renderParent=function(){hideParentTools();if(Date.now()>=parentUntil){renderRewardGate();return}parentRewardPanel.innerHTML='<h2>👪 家長獎勵管理</h2><button id="lockRewards" class="secondary">🔒 鎖定家長專區</button><h3>孩子的點數</h3>'+state.children.map(c=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+rewardStats(c.id)+'</p></div>').join('')+'<h3>提供新獎勵</h3><form id="newRewardForm"><label>獎勵名稱<input id="newRewardName" maxlength="80" placeholder="例如：選一本喜歡的書" required></label><label>需要點數<input id="newRewardCost" type="number" min="1" max="10000" step="1" value="20" required></label><button>新增獎勵</button></form><p id="parentRewardMessage" aria-live="polite"></p><h3>等待核對與發放</h3><div id="pendingRewards">'+state.rewardSystem.requests.filter(q=>q.status==='pending').map(q=>'<div class="card"><h4>'+esc(state.children.find(c=>c.id===q.childId)?.name)+'：'+esc(q.name)+'</h4><p>'+q.cost+' 點</p><button data-approve="'+q.id+'">確認已發放並扣點</button><button class="secondary" data-reject="'+q.id+'">不兌換／退回點數</button></div>').join('')+'</div><h3>目前獎勵</h3>'+state.rewardSystem.catalog.map(r=>'<div class="card">'+esc(r.name)+'｜'+r.cost+' 點 <button class="secondary" data-remove-reward="'+esc(r.id)+'">下架</button></div>').join('')+'<h3>兌換紀錄</h3>'+state.rewardSystem.requests.filter(q=>q.status!=='pending').slice(-30).reverse().map(q=>'<p>'+esc(state.children.find(c=>c.id===q.childId)?.name)+'｜'+esc(q.name)+'｜'+q.cost+' 點｜'+requestLabel(q)+'</p>').join('');if(!$('pendingRewards').textContent)$('pendingRewards').textContent='目前沒有待核對的申請。';$('lockRewards').onclick=()=>{parentUntil=0;renderParent()};$('newRewardForm').onsubmit=e=>{e.preventDefault();try{addReward($('newRewardName').value,Number($('newRewardCost').value));renderParent();$('parentRewardMessage').textContent='獎勵已新增，孩子可以到獎勵小舖兌換。'}catch(err){$('parentRewardMessage').textContent=err.message}};for(let [attr,fn] of [['data-approve',id=>reviewReward(id,true)],['data-reject',id=>reviewReward(id,false)],['data-remove-reward',removeReward]])parentRewardPanel.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>{try{fn(b.getAttribute(attr));renderParent()}catch(err){$('parentRewardMessage').textContent=err.message}})};
