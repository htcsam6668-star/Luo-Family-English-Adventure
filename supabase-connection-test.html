<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羅家英文冒險島｜雲端連線測試</title><style>body{font-family:system-ui,sans-serif;background:#f2f0ff;padding:24px;color:#29304c}main{max-width:520px;margin:auto;background:white;padding:24px;border-radius:18px}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:6px}button{padding:12px;background:#7055d9;color:white;border:0;border-radius:8px;margin-right:8px}pre{white-space:pre-wrap;background:#f2f0ff;padding:14px;border-radius:8px}</style></head><body><main><h1>🏝️ 羅家英文冒險島</h1><h2>Supabase 家庭連線測試</h2><p>僅測試登入與讀取家庭、孩子資料，不修改點數及紀錄。</p><form id="login"><label>家長 Email<input id="email" type="email" required autocomplete="username"></label><label>密碼<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">登入並讀取</button></form><button id="logout" type="button">登出</button><pre id="status" aria-live="polite">載入中…</pre></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/+esm';const db=createClient('https://jlpxiviwmpxrqjgnakka.supabase.co','sb_publishable_1_m0DKCcv4GVrdVaFyFunQ_CwiN6oWn');const status=document.getElementById('status');async function read(){const{data:{user},error:e}=await db.auth.getUser();if(e||!user){status.textContent='尚未登入';return}const{data:f,error:fe}=await db.from('families').select('id,name').eq('owner_id',user.id);if(fe)throw fe;if(!f?.length){status.textContent='登入成功，但找不到此帳號的家庭資料';return}const{data:c,error:ce}=await db.from('children').select('display_name,grade_level').eq('family_id',f[0].id);if(ce)throw ce;status.textContent='登入成功\n家庭：'+f[0].name+'\n孩子：'+c.map(x=>x.display_name+'（年級代碼 '+x.grade_level+'）').join('、')}document.getElementById('login').onsubmit=async e=>{e.preventDefault();status.textContent='登入中…';try{const{error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('password').value='';if(error)throw error;await read()}catch(x){status.textContent='錯誤：'+x.message}};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();status.textContent='已登出'};read().catch(x=>status.textContent='錯誤：'+x.message);</script></body></html>
