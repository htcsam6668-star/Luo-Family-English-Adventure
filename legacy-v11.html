<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7356d8"><link rel="manifest" href="manifest.webmanifest"><title>羅家英文冒險島</title><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#29304c;background:#f2f0ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#7455da,#46b9cb);color:white;padding:20px}main{max-width:850px;margin:auto;padding:15px}.panel{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 20px #493c8a15}button,select,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #ddd}button{cursor:pointer;background:#6c55d9;color:white;border:0;margin:4px}button.secondary{background:#eef0ff;color:#483a9c}.tabs{display:flex;flex-wrap:wrap}.tabs button.active{background:#ffac43;color:#312400}.hidden{display:none}.big{font-size:90px;text-align:center}.center{text-align:center}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.options button{min-height:70px}.muted{color:#64708a}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.stat{background:#f2f1ff;padding:10px;border-radius:12px}.good{color:#12845a}.bad{color:#bf3c4c}input{max-width:100%}label{display:block;margin:10px 0}footer{text-align:center;color:#64708a;padding:20px}@media(max-width:500px){.panel{padding:14px}.big{font-size:75px}}
header{background:linear-gradient(120deg,#7352d9,#2cb7c8)}.hero{display:flex;align-items:center;gap:20px;max-width:850px;margin:auto}.hero img{width:130px;height:130px;object-fit:cover;border-radius:26px;box-shadow:0 8px 25px #241a6b55}.hero h1{margin:0 0 8px}.profile-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.profile-buttons button{background:#fff;color:#563ba7;border:2px solid #e3d8ff;font-weight:700}.profile-buttons button.selected{background:#ffe28a;color:#45330a;border-color:#e3ac32}.welcome{background:linear-gradient(115deg,#fff2cb,#f4eaff)}@media(max-width:500px){.hero img{width:100px;height:100px}.hero h1{font-size:22px}}
</style></head><body><header><div class="hero"><img src="family-adventure.png" alt="姊姊、弟弟與小龍在羅家英文冒險島"><div><h1>🏝️ 羅家英文冒險島</h1><div>Luo Family English Adventure</div><p>姊姊與弟弟的英文闖關樂園 🐉</p></div></div></header><main><section class="panel welcome"><h2>🌟 今天誰要去冒險？</h2><p class="muted">點選冒險家，切換專屬學習程度與紀錄。</p><div id="profileButtons" class="profile-buttons"></div></section><section class="panel"><div class="row"><label>小小冒險家 <select id="child"></select></label><label>學習程度 <select id="level"><option value="幼兒">幼兒 3～6 歲</option><option value="低年級">國小一～二年級</option><option value="中年級">國小三～四年級</option><option value="高年級">國小五～六年級</option></select></label></div><div class="tabs" id="tabs"><button data-tab="learn" class="active">📚 學單字</button><button data-tab="quiz">🎯 闖關測驗</button><button data-tab="review">🔁 錯題複習</button><button data-tab="records">🏆 學習紀錄</button><button data-tab="parent">👨‍👩‍👧 家長管理</button></div></section><section id="learn" class="panel"><h2>📚 單字學習</h2><div id="learnCard"></div><div class="center"><button id="speak">🔊 聽英文</button><button id="prev" class="secondary">上一個</button><button id="next">下一個 ➜</button></div></section><section id="quiz" class="panel hidden"><h2>🎯 英文闖關</h2><div class="row"><label>題型 <select id="quizType"><option value="choice">看中文選英文</option><option value="spell">中文考英文拼字</option><option value="listen">聽英文選中文</option></select></label><button id="start">開始新挑戰</button></div><div id="question">選擇題型後按「開始新挑戰」。</div></section><section id="review" class="panel hidden"><h2>🔁 錯題複習</h2><div id="reviewContent"></div></section><section id="records" class="panel hidden"><h2>🏆 學習紀錄</h2><div id="recordContent"></div></section><section id="parent" class="panel hidden"><h2>👨‍👩‍👧 家長管理</h2><p>學習資料只保存在目前瀏覽器裝置。此版本沒有雲端帳號或跨裝置同步。</p><label>新增孩子暱稱 <input id="newName" maxlength="20" placeholder="例如：小明"></label><button id="addChild">新增孩子</button><button id="export">匯出所有紀錄 JSON</button><label>匯入備份 JSON <input id="import" type="file" accept="application/json,.json"></label><p class="muted">家長區目前沒有密碼保護；請勿輸入孩子的真實姓名或敏感資料。</p><div id="parentContent"></div></section></main><footer>羅家英文冒險島 V1.1｜離線教材・瀏覽器語音</footer><script>
const DATA=[
['幼兒',[['apple','蘋果','🍎'],['dog','狗','🐶'],['cat','貓','🐱'],['sun','太陽','☀️'],['water','水','💧'],['banana','香蕉','🍌'],['red','紅色','🔴'],['blue','藍色','🔵'],['bird','鳥','🐦'],['fish','魚','🐟'],['milk','牛奶','🥛'],['book','書','📖'],['ball','球','⚽'],['car','汽車','🚗'],['tree','樹','🌳'],['star','星星','⭐'],['moon','月亮','🌙'],['hand','手','✋'],['eye','眼睛','👁️'],['egg','蛋','🥚']]],
['低年級',[['school','學校','🏫'],['teacher','老師','👩‍🏫'],['pencil','鉛筆','✏️'],['chair','椅子','🪑'],['table','桌子','🪵'],['family','家庭','👨‍👩‍👧'],['mother','媽媽','👩'],['father','爸爸','👨'],['friend','朋友','🤝'],['happy','開心的','😊'],['sad','難過的','😢'],['run','跑','🏃'],['jump','跳','🦘'],['read','閱讀','📚'],['write','寫字','✍️'],['morning','早晨','🌅'],['night','夜晚','🌃'],['green','綠色','🟢'],['yellow','黃色','🟡'],['orange','橘子','🍊']]],
['中年級',[['cloudy','多雲的','☁️'],['windy','有風的','🌬️'],['sunny','晴朗的','☀️'],['rainy','下雨的','🌧️'],['weather','天氣','🌤️'],['hungry','肚子餓的','🍽️'],['thirsty','口渴的','🥤'],['tired','疲倦的','😴'],['angry','生氣的','😠'],['warm','溫暖的','🌡️'],['cool','涼爽的','🍃'],['cold','寒冷的','🥶'],['hot','炎熱的','🔥'],['breakfast','早餐','🥪'],['lunch','午餐','🍱'],['dinner','晚餐','🍛'],['library','圖書館','📚'],['hospital','醫院','🏥'],['weekend','週末','🎈'],['birthday','生日','🎂']]],
['高年級',[['environment','環境','🌍'],['recycle','回收','♻️'],['exercise','運動','🏃'],['healthy','健康的','💪'],['dangerous','危險的','⚠️'],['important','重要的','❗'],['different','不同的','🔀'],['because','因為','💬'],['before','在……之前','⏮️'],['after','在……之後','⏭️'],['usually','通常','🔁'],['sometimes','有時候','🕒'],['always','總是','♾️'],['never','從不','🚫'],['travel','旅行','🧳'],['country','國家','🗺️'],['future','未來','🚀'],['science','科學','🔬'],['history','歷史','🏛️'],['question','問題','❓']]]];
const key='englishAdventureV1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.children))state={children:[{id:'luo-sister',name:'姊姊｜小四',level:'中年級',history:[]},{id:'luo-brother',name:'弟弟｜幼兒園小班',level:'幼兒',history:[]}],active:'luo-sister'};let idx=0,tab='learn',quiz=null;const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){alert('儲存失敗，請檢查瀏覽器儲存空間')}};const kid=()=>state.children.find(x=>x.id===state.active)||state.children[0];const pool=()=>DATA.find(x=>x[0]===kid().level)[1];const wordKey=(w)=>kid().level+':'+w[0];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(s){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function renderSelect(){ $('profileButtons').innerHTML=state.children.map(c=>`<button class="${c.id===kid().id?'selected':''}" data-profile="${escapeHtml(c.id)}">${c.level==='幼兒'?'🐣':'🎒'} ${escapeHtml(c.name)}</button>`).join(''); $('child').innerHTML=state.children.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');$('child').value=kid().id;$('level').value=kid().level}function renderLearn(){const w=pool()[((idx%pool().length)+pool().length)%pool().length];$('learnCard').innerHTML=`<div class="center"><p class="muted">第 ${idx%pool().length+1} / ${pool().length} 個</p><div class="big">${w[2]}</div><h1>${w[0]}</h1><h2>${w[1]}</h2></div>`}function switchTab(t){tab=t;document.querySelectorAll('main>section[id]').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='records')renderRecords();if(t==='review')renderReview();if(t==='parent')renderParent()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startQuiz(onlyWrong=false){let arr=onlyWrong?pool().filter(w=>wrongKeys().has(wordKey(w))):pool();if(!arr.length){$('question').textContent='目前沒有可複習的錯題。';switchTab('quiz');return}quiz={items:shuffle(arr).slice(0,10),pos:0,score:0,locked:false,type:onlyWrong?'choice':$('quizType').value};switchTab('quiz');renderQuestion()}function renderQuestion(){if(!quiz)return;if(quiz.pos>=quiz.items.length){$('question').innerHTML=`<div class="center"><h2>🎉 挑戰完成！</h2><h1>${quiz.score} / ${quiz.items.length}</h1><p>你的努力值得一顆星星 ⭐</p><button id="again">再挑戰一次</button></div>`;$('again').onclick=()=>startQuiz();return}let w=quiz.items[quiz.pos],type=quiz.type;let html=`<p class="muted">第 ${quiz.pos+1} / ${quiz.items.length} 題｜本次答對 ${quiz.score}</p>`;if(type==='choice'){let opts=shuffle([w,...shuffle(pool().filter(x=>x!==w)).slice(0,3)]);html+=`<div class="center big">${w[2]}</div><h2 class="center">${w[1]} 的英文是？</h2><div class="options">${opts.map(o=>`<button class="answer" data-answer="${o[0]}">${o[0]}</button>`).join('')}</div>`}else if(type==='listen'){let opts=shuffle([w,...shuffle(pool().filter(x=>x!==w)).slice(0,3)]);html+=`<div class="center"><h2>仔細聽英文，選出中文意思</h2><button id="playQuestion">🔊 播放英文</button></div><div class="options">${opts.map(o=>`<button class="answer" data-answer="${o[0]}">${o[1]}</button>`).join('')}</div>`}else html+=`<div class="center big">${w[2]}</div><h2 class="center">${w[1]} 的英文怎麼拼？</h2><div class="center"><input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文單字"><button id="submitSpell">確認</button></div>`;html+='<div id="feedback" aria-live="polite"></div>';$('question').innerHTML=html;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>submit(b.dataset.answer));if(type==='listen')$('playQuestion').onclick=()=>speak(w[0]);if(type==='spell'){$('submitSpell').onclick=()=>submit($('spellInput').value);$('spellInput').onkeydown=e=>{if(e.key==='Enter')submit($('spellInput').value)}}}function submit(value){if(!quiz||quiz.locked)return;quiz.locked=true;const w=quiz.items[quiz.pos],ok=value.trim().toLowerCase()===w[0];if(ok)quiz.score++;kid().history.push({key:wordKey(w),word:w[0],correct:ok,type:quiz.type,time:new Date().toISOString()});save();document.querySelectorAll('.answer,#submitSpell,#spellInput').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<p class="center ${ok?'good':'bad'}"><strong>${ok?'答對了！🌟':'再接再厲！💪'}</strong> 正確答案：${w[0]}（${w[1]}）</p><div class="center"><button id="nextQuestion">下一題 ➜</button><button id="hearAnswer" class="secondary">🔊 聽正確發音</button></div>`;$('nextQuestion').onclick=()=>{quiz.pos++;quiz.locked=false;renderQuestion()};$('hearAnswer').onclick=()=>speak(w[0])}function wrongKeys(){const latest=new Map();kid().history.forEach(h=>latest.set(h.key,h.correct));return new Set([...latest].filter(x=>!x[1]).map(x=>x[0]))}function renderReview(){const wrong=pool().filter(w=>wrongKeys().has(wordKey(w)));$('reviewContent').innerHTML=`<p>目前程度的待複習單字：<strong>${wrong.length}</strong> 個</p>${wrong.map(w=>`<span class="stat" style="display:inline-block;margin:4px">${w[2]} ${w[0]}｜${w[1]}</span>`).join('')||'<p class="good">目前沒有待複習錯題，繼續保持！</p>'}<p><button id="reviewStart" ${wrong.length?'':'disabled'}>開始錯題挑戰</button></p>`;$('reviewStart').onclick=()=>startQuiz(true)}function renderRecords(){let h=kid().history,correct=h.filter(x=>x.correct).length,latest=new Map();h.forEach(x=>latest.set(x.key,x.correct));$('recordContent').innerHTML=`<div class="row"><span class="stat">累計答題：<b>${h.length}</b></span><span class="stat">答對：<b>${correct}</b></span><span class="stat">正確率：<b>${h.length?Math.round(correct/h.length*100):0}%</b></span><span class="stat">已練習單字：<b>${latest.size}</b></span></div><h3>最近 20 筆作答</h3>${h.length?'<ul>'+h.slice(-20).reverse().map(x=>`<li>${escapeHtml(x.word)}｜${x.correct?'✅ 正確':'❌ 錯誤'}｜${new Date(x.time).toLocaleString('zh-TW')}</li>`).join('')+'</ul>':'<p>還沒有測驗紀錄。</p>'}`}
function renderParent(){$('parentContent').innerHTML='<h3>孩子學習概況</h3>'+state.children.map(c=>`<div class="stat" style="margin:8px 0"><b>${escapeHtml(c.name)}</b>｜${escapeHtml(c.level)}｜累計 ${c.history.length} 題</div>`).join('')}function refresh(){renderSelect();renderLearn();quiz=null;$('question').textContent='選擇題型後按「開始新挑戰」。';if(tab==='records')renderRecords();if(tab==='review')renderReview();if(tab==='parent')renderParent()}
$('profileButtons').onclick=e=>{const b=e.target.closest('[data-profile]');if(!b)return;state.active=b.dataset.profile;idx=0;save();refresh()};$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)};$('child').onchange=e=>{state.active=e.target.value;idx=0;save();refresh()};$('level').onchange=e=>{kid().level=e.target.value;idx=0;save();refresh()};$('speak').onclick=()=>speak(pool()[idx%pool().length][0]);$('prev').onclick=()=>{idx=(idx-1+pool().length)%pool().length;renderLearn()};$('next').onclick=()=>{idx=(idx+1)%pool().length;renderLearn()};$('start').onclick=()=>startQuiz();$('addChild').onclick=()=>{let name=$('newName').value.trim();if(!name)return alert('請輸入暱稱');if(state.children.length>=10)return alert('最多 10 位孩子');let id='kid'+Date.now();state.children.push({id,name,level:'幼兒',history:[]});state.active=id;$('newName').value='';save();refresh()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='english-adventure-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.children)||!v.children.length||v.children.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!DATA.some(x=>x[0]===c.level)||!Array.isArray(c.history)))throw Error('格式不符');if(!confirm('匯入將覆蓋目前所有孩子與學習紀錄，確定嗎？'))return;state=v;state.active=state.children.some(c=>c.id===v.active)?v.active:state.children[0].id;save();refresh();alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};refresh();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
